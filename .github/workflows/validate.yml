name: Validate Code

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  terragrunt:
    name: Terragrunt Validation
    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment: [dev, prod]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.5

      - name: Setup Terragrunt
        run: |
          wget -q https://github.com/gruntwork-io/terragrunt/releases/download/v0.68.16/terragrunt_linux_amd64
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt

      - name: Terragrunt Init
        run: cd environments/${{ matrix.environment }} && terragrunt init -backend=false
        env:
          PROXMOX_API_URL: "https://example.com:8006/api2/json"
          PROXMOX_API_TOKEN_ID: "test@pam!test"
          PROXMOX_API_TOKEN_SECRET: "test-secret"
          SSH_PUBLIC_KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI test@example.com"

      - name: Terragrunt Validate
        run: cd environments/${{ matrix.environment }} && terragrunt validate
        env:
          PROXMOX_API_URL: "https://example.com:8006/api2/json"
          PROXMOX_API_TOKEN_ID: "test@pam!test"
          PROXMOX_API_TOKEN_SECRET: "test-secret"
          SSH_PUBLIC_KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI test@example.com"

  ansible:
    name: Ansible Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible and dependencies
        run: pip install ansible ansible-lint

      - name: Ansible Syntax Check
        run: |
          cd ansible
          ansible-playbook --syntax-check k3s-install.yml
          ansible-playbook --syntax-check system-utils-install.yml
          ansible-playbook --syntax-check argocd-install.yml

      - name: Ansible Lint
        run: |
          cd ansible
          ansible-lint k3s-install.yml system-utils-install.yml argocd-install.yml

  yaml:
    name: YAML Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: YAML Lint
        run: yamllint -c .yamllint.yml .
        continue-on-error: true

  shell:
    name: Shell Script Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          check_together: true
